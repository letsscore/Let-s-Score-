<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Continue Enrolment | LET’S SCORE</title>
<link rel="stylesheet" href="styles.css">
<style>
body{min-height:100vh;display:grid;place-items:center}.redirect-card{max-width:620px;margin:24px;padding:28px;border:1px solid var(--line);border-radius:18px;background:var(--panel, #0d203a);text-align:center}.redirect-card a{display:inline-block;margin:8px;padding:12px 18px;border-radius:10px;background:#0ea5e9;color:white;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main class="redirect-card">
<h1>Continue your enrolment</h1>
<p id="status">Opening the secure course enrolment page…</p>
<p>If you are not redirected automatically, use the button below.</p>
<a id="continue" href="courses.html">Continue</a>
<a href="courses.html">Browse courses</a>
</main>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const course = params.get('course') || params.get('id') || '';
  const known = new Set(['class10-assamese-free','class10-assamese-paid','class10-english','class11-physics','class12-physics']);
  const target = known.has(course) ? 'course.html?id=' + encodeURIComponent(course) : 'courses.html';
  document.getElementById('continue').href = target;
  document.getElementById('status').textContent = known.has(course)
    ? 'Redirecting you to the selected course to choose your package and submit payment details…'
    : 'No valid course was selected. Opening the course catalogue…';
  location.replace(target);
})();
</script>
</body>
</html>
