<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class X Revisionary Test | Let's Score</title><style>

.wrap{max-width:900px;margin:auto;padding:18px 16px 50px}.nav{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #263756}.nav a{color:#38bdf8;text-decoration:none;font-weight:800;margin-left:12px}
.hero{text-align:center;padding:35px 0 25px}.muted{color:#b9c5d8}.card{background:#12213a;border:1px solid #263756;border-radius:18px;padding:20px;margin:16px 0}

<body><main class="wrap"><div class="nav"><a href="index.html">🎓 LET'S SCORE</a><span><a href="revisionary-test.html">Tests</a></span></div>
<section class="hero"><div class="muted">REVISIONARY TEST • CLASS X</div><h1 id="title">Loading test…</h1><div id="status" class="status">Checking test status…</div></section>
<section id="login" class="card"><h2>Student Details</h2><label>Name</label><input id="name" placeholder="Enter your name"><button id="startBtn">Continue</button></section>
<section id="test" class="card" style="display:none"></section>
<section id="result" class="card" style="display:none"></section></main>
<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  push,
  set
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ================================
   FIREBASE CONFIGURATION
   ================================ */

const firebaseConfig = {
  apiKey: "AIzaSyBdsypDM6A2Q1LO3GTueeg8RfTirXGZIP8",
  authDomain: "lets-score-revisionary-test.firebaseapp.com",
  databaseURL: "https://lets-score-revisionary-test-default-rtdb.firebaseio.com",
  projectId: "lets-score-revisionary-test",
  storageBucket: "lets-score-revisionary-test.firebasestorage.app",
  messagingSenderId: "629595293837",
  appId: "1:629595293837:web:b0fd9e83f22651cd577ac4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const CLASS = "classX";


/* ================================
   CLASS X
   IMPORTANT: classX (capital X)
   ================================ */

const CLASS = "classX";


/* ================================
   ELEMENTS
   ================================ */

const titleBox = document.getElementById("title");
const statusBox = document.getElementById("status");
const loginBox = document.getElementById("login");
const testBox = document.getElementById("test");
const resultBox = document.getElementById("result");
const nameInput = document.getElementById("name");
const startBtn = document.getElementById("startBtn");


/* ================================
   STATE
   ================================ */

let currentTest = null;
let answers = {};
let studentName = "";
let firebaseReady = false;


/* ================================
   INITIAL STATE
   ================================ */

startBtn.disabled = true;

statusBox.innerHTML = "Checking test status…";


/* ================================
   LISTEN TO CLASS X TESTS
   ================================ */

const classRef = ref(db, `revisionaryTests/${CLASS}`);

onValue(
  classRef,

  (snapshot) => {

    firebaseReady = true;
    startBtn.disabled = false;

    const data = snapshot.val() || {};

    /*
      Teacher Control stores:
      revisionaryTests
        └── classX
            └── TEST_ID
                ├── live: true
                ├── title
                ├── questions
                └── ...
    */

    const liveTests = Object.entries(data)
      .filter(([id, test]) => test && test.live === true);

    if (liveTests.length === 0) {

      currentTest = null;

      titleBox.textContent = "Revisionary Test";

      statusBox.innerHTML =
        '<span class="closed">● TEST NOT LIVE</span>';

      return;
    }


    /* Take the first live test */
    const [testId, testData] = liveTests[0];

    currentTest = {
      id: testId,
      ...testData
    };


    titleBox.textContent =
      testData.title || "Class X Revisionary Test";

    statusBox.innerHTML =
      '<span class="live">● TEST LIVE</span>';

  },

  (error) => {

    console.error("Firebase status error:", error);

    firebaseReady = true;
    startBtn.disabled = false;

    currentTest = null;

    titleBox.textContent = "Revisionary Test";

    statusBox.innerHTML =
      '<span class="closed">Firebase status could not be loaded.</span>';

  }
);


/* ================================
   CONTINUE / START TEST
   ================================ */

startBtn.onclick = () => {

  studentName = nameInput.value.trim();

  if (!studentName) {
    alert("Please enter your name.");
    return;
  }

  if (!firebaseReady) {
    alert("Please wait while the test status is loading.");
    return;
  }

  if (!currentTest) {
    alert("The Class X test is not live.");
    return;
  }

  loginBox.style.display = "none";
  testBox.style.display = "block";

  answers = {};

  renderTest();
};


/* ================================
   RENDER QUESTIONS
   ================================ */

function renderTest() {

  const questions =
    Object.values(currentTest.questions || {});


  if (!questions.length) {

    testBox.innerHTML = `
      <h2>${escapeHtml(
        currentTest.title || "Revisionary Test"
      )}</h2>

      <p class="closed">
        No questions are available in this test.
      </p>
    `;

    return;
  }


  testBox.innerHTML = `

    <h2>
      ${escapeHtml(
        currentTest.title || "Class X Revisionary Test"
      )}
    </h2>

    <p class="muted">
      ${escapeHtml(currentTest.instructions || "")}
    </p>

    <div id="questions"></div>

    <button id="submit">
      Submit Test
    </button>
  `;


  const questionBox =
    document.getElementById("questions");


  questions.forEach((q, index) => {

    const questionCard =
      document.createElement("div");

    questionCard.className = "review";


    const questionTitle =
      document.createElement("strong");

    questionTitle.textContent =
      `${index + 1}. ${q.question || ""}`;

    questionCard.appendChild(questionTitle);


    ["A", "B", "C", "D"].forEach(option => {

      const button =
        document.createElement("button");

      button.className = "option";

      button.textContent =
        `${option}. ${q.options?.[option] || ""}`;


      button.onclick = () => {

        answers[index] = option;

        questionCard
          .querySelectorAll(".option")
          .forEach(b => b.classList.remove("selected"));

        button.classList.add("selected");
      };


      questionCard.appendChild(button);

    });


    questionBox.appendChild(questionCard);

  });


<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  push,
  set
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ================================
   FIREBASE
   ================================ */

const firebaseConfig = {
  apiKey: "AIzaSyBdsypDM6A2Q1LO3GTueeg8RfTirXGZIP8",
  authDomain: "lets-score-revisionary-test.firebaseapp.com",
  databaseURL: "https://lets-score-revisionary-test-default-rtdb.firebaseio.com",
  projectId: "lets-score-revisionary-test",
  storageBucket: "lets-score-revisionary-test.firebasestorage.app",
  messagingSenderId: "629595293837",
  appId: "1:629595293837:web:b0fd9e83f22651cd577ac4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* IMPORTANT — ONLY ONE CLASS CONSTANT */

const CLASS = "classX";


/* ================================
   ELEMENTS
   ================================ */

const titleBox = document.getElementById("title");
const statusBox = document.getElementById("status");
const loginBox = document.getElementById("login");
const testBox = document.getElementById("test");
const resultBox = document.getElementById("result");
const nameInput = document.getElementById("name");
const startBtn = document.getElementById("startBtn");


/* ================================
   STATE
   ================================ */

let currentTest = null;
let answers = {};
let studentName = "";
let firebaseReady = false;


/* ================================
   INITIAL STATE
   ================================ */

startBtn.disabled = true;

statusBox.textContent = "Checking test status…";


/* ================================
   FIREBASE TEST LISTENER
   ================================ */

const classRef = ref(db, `revisionaryTests/${CLASS}`);

onValue(
  classRef,

  (snapshot) => {

    firebaseReady = true;

    const data = snapshot.val() || {};

    const liveTests = Object.entries(data)
      .filter(([id, test]) => {
        return test &&
               (test.live === true || test.live === "true");
      });


    /* No live test */

    if (liveTests.length === 0) {

      currentTest = null;

      titleBox.textContent = "Revisionary Test";

      statusBox.innerHTML =
        '<span class="closed">● TEST NOT LIVE</span>';

      startBtn.disabled = false;

      return;
    }


    /* First live test */

    const [testId, testData] = liveTests[0];

    currentTest = {
      id: testId,
      ...testData
    };


    titleBox.textContent =
      testData.title || "Class X Revisionary Test";

    statusBox.innerHTML =
      '<span class="live">● TEST LIVE</span>';

    startBtn.disabled = false;

  },

  (error) => {

    console.error("Firebase status error:", error);

    firebaseReady = false;

    currentTest = null;

    titleBox.textContent = "Revisionary Test";

    statusBox.innerHTML =
      '<span class="closed">Firebase status could not be loaded.</span>';

    startBtn.disabled = true;
  }
);


/* ================================
   CONTINUE
   ================================ */

startBtn.onclick = () => {

  studentName = nameInput.value.trim();

  if (!studentName) {
    alert("Please enter your name.");
    return;
  }

  if (!firebaseReady) {
    alert("Firebase status is not available. Please refresh the page.");
    return;
  }

  if (!currentTest) {
    alert("The Class X test is not live.");
    return;
  }


  loginBox.style.display = "none";
  testBox.style.display = "block";

  answers = {};

  renderTest();
};


/* ================================
   RENDER EXISTING QUESTION PAPER
   ================================ */

function renderTest() {

  const rawQuestions = currentTest.questions || {};

  const questions = Array.isArray(rawQuestions)
    ? rawQuestions
    : Object.values(rawQuestions);


  if (!questions.length) {

    testBox.innerHTML = `
      <h2>${escapeHtml(
        currentTest.title || "Class X Revisionary Test"
      )}</h2>

      <p class="closed">
        No questions are available in this test paper.
      </p>
    `;

    return;
  }


  testBox.innerHTML = `

    <h2>
      ${escapeHtml(
        currentTest.title || "Class X Revisionary Test"
      )}
    </h2>

    <p class="muted">
      ${escapeHtml(currentTest.instructions || "")}
    </p>

    <div id="questions"></div>

    <button id="submit">
      Submit Test
    </button>
  `;


  const questionBox =
    document.getElementById("questions");


  questions.forEach((q, index) => {

    const questionCard =
      document.createElement("div");

    questionCard.className = "review";


    const questionTitle =
      document.createElement("strong");

    questionTitle.textContent =
      `${index + 1}. ${q.question || ""}`;

    questionCard.appendChild(questionTitle);


    ["A", "B", "C", "D"].forEach(option => {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className = "option";

      button.textContent =
        `${option}. ${q.options?.[option] || ""}`;


      button.onclick = () => {

        answers[index] = option;

        questionCard
          .querySelectorAll(".option")
          .forEach(b => {
            b.classList.remove("selected");
          });

        button.classList.add("selected");
      };


      questionCard.appendChild(button);

    });


    questionBox.appendChild(questionCard);

  });


  document.getElementById("submit").onclick =
    submitTest;
}


/* ================================
   SUBMIT TEST
   ================================ */

async function submitTest() {

  if (!currentTest) return;


  const rawQuestions =
    currentTest.questions || {};

  const questions =
    Array.isArray(rawQuestions)
      ? rawQuestions
      : Object.values(rawQuestions);


  let score = 0;

  const wrong = [];


  questions.forEach((q, index) => {

    const selected =
      answers[index];

    const correct =
      String(q.correct || "").toUpperCase();


    if (
      selected &&
      String(selected).toUpperCase() === correct
    ) {

      score++;

    } else {

      wrong.push({

        number: index + 1,

        question:
          q.question || "",

        yourAnswer:
          selected || "Not answered",

        correct:
          correct

      });

    }

  });


  const resultRef =
    push(
      ref(
        db,
        `results/${CLASS}/${currentTest.id}`
      )
    );


  const result = {

    name: studentName,

    score: score,

    maxMarks: questions.length,

    wrongAnswers: wrong,

    submittedAt: Date.now()

  };


  try {

    await set(resultRef, result);

    showResult(result);

  } catch (error) {

    console.error(
      "Result submission error:",
      error
    );

    alert(
      "Could not submit result. Please check your internet connection."
    );

  }

}


/* ================================
   SHOW RESULT
   ================================ */

function showResult(result) {

  testBox.style.display = "none";

  resultBox.style.display = "block";


  resultBox.innerHTML = `

    <h2>Test Submitted</h2>

    <div class="result">
      ${result.score} / ${result.maxMarks}
    </div>

    <p class="muted">
      ${result.wrongAnswers.length}
      wrong / unanswered
    </p>

    <h3>Wrong Answers</h3>

  `;


  if (result.wrongAnswers.length === 0) {

    resultBox.innerHTML += `
      <p class="live">
        Excellent! All answers are correct.
      </p>
    `;

    return;
  }


  result.wrongAnswers.forEach(w => {

    const div =
      document.createElement("div");

    div.className = "review";


    div.innerHTML = `

      <strong>
        Q${w.number}.
        ${escapeHtml(w.question)}
      </strong>

      <br>

      Your answer:
      ${escapeHtml(w.yourAnswer)}

      <br>

      Correct answer:
      ${escapeHtml(w.correct)}

    `;


    resultBox.appendChild(div);

  });

}


/* ================================
   ESCAPE HTML
   ================================ */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/[&<>"']/g, char => ({

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"

    }[char]));

}
</script></body></html>
