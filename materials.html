<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Materials | LET’S SCORE</title><meta name="description" content="Access your approved course materials"><style>
:root{color-scheme:dark;--bg:#061326;--panel:#0d203a;--line:#23466b;--text:#f4f8ff;--muted:#bdcfe5;--cyan:#21c8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}.brand{font-weight:900;color:var(--cyan);font-size:22px;text-decoration:none}.top a:not(.brand),a{color:#70dcff}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0}h1{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:0 0 16px}h2{margin-top:0}.muted{color:var(--muted)}label{display:block;margin:14px 0 6px}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #345879;background:#061326;color:#fff;font:inherit}.btn{display:inline-block;padding:12px 17px;background:linear-gradient(120deg,#04b8f5,#4c55ff);color:#fff!important;border:0;border-radius:10px;font-weight:700;text-decoration:none;cursor:pointer;margin:10px 8px 0 0}.btn.alt{background:#183b59}.btn:disabled{opacity:.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.tile{padding:18px;border:1px solid var(--line);border-radius:14px;background:#0a1a30}.msg{padding-top:12px;color:#9ce9ff;overflow-wrap:anywhere}.hidden{display:none!important}.resource{padding:16px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.resource a{display:inline-block;margin:5px 0}footer{color:var(--muted);text-align:center;padding:28px 10px}@media(max-width:600px){.wrap{padding:15px}.panel{padding:18px}}
</style></head><body><div class="wrap"><nav class="top"><a class="brand" href="index.html">🎓 LET’S SCORE</a><div><a href="index.html">Home</a>　<a href="courses.html">Courses</a>　<a href="register.html">Account</a></div></nav><section class="panel"><a href="courses.html">← Courses</a><h1 id="title">Course Materials</h1><p id="state" class="muted">Checking course access…</p><div id="resources"></div></section></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import {getDatabase,ref,get} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js';
const ADMIN_UID='q8Ybthhc3jQEhQf4e5EAFpYIaDv1';
const firebaseConfig={apiKey:"AIzaSyBdsypDM6A2Q1LO3GTueeg8RfTirXGZIP8",authDomain:"lets-score-revisionary-test.firebaseapp.com",databaseURL:"https://lets-score-revisionary-test-default-rtdb.firebaseio.com",projectId:"lets-score-revisionary-test",storageBucket:"lets-score-revisionary-test.firebasestorage.app",messagingSenderId:"629595293837",appId:"1:629595293837:web:b0fd9e83f22651cd577ac4"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=x=>document.getElementById(x),id=new URLSearchParams(location.search).get('id');
const courses={'class10-assamese-free':'Class X Science — Assamese Medium (Free)','class10-assamese-paid':'Class X Science — Assamese Medium','class10-english':'Class X Science — English Medium','class11-physics':'Class XI Physics — English Medium','class12-physics':'Class XII Physics — English Medium'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(u){if(!courses[id]){location.href='courses.html';return}$('title').textContent=courses[id];let pkg='notes';
if(id!=='class10-assamese-free'){const s=await get(ref(db,`courseAccess/${id}/${u.uid}`)),a=s.val();if(!a||a.active!==true){location.href='course.html?id='+id;return}pkg=a.package||'notes'}
const cats=id==='class10-assamese-free'?['notes']:pkg==='videos'?['notes','solutions','questions','papers','videos']:['notes','solutions','questions','papers'];
$('state').textContent=id==='class10-assamese-free'?'Free course · Notes only':pkg==='videos'?'Approved · Materials + recorded videos':'Approved · Study materials';
for(const cat of cats){const snap=await get(ref(db,`courseResources/${id}/${cat}`)),data=snap.val()||{},section=document.createElement('section');section.className='resource';const h=document.createElement('h2');h.textContent=({notes:'Chapter-wise Notes',solutions:'NCERT Solutions',questions:'Question & Answer Bank',papers:'Practice / Model Papers',videos:'Recorded Video Lectures'})[cat];section.append(h);const items=Object.values(data);if(!items.length){const p=document.createElement('p');p.className='muted';p.textContent='No materials published here yet.';section.append(p)}for(const item of items){if(!item||!item.url)continue;const a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='↗ '+(item.title||'Open resource');section.append(a);section.append(document.createElement('br'))}$('resources').append(section)}
}
onAuthStateChanged(auth,async u=>{if(!u){location.replace('register.html?next='+encodeURIComponent('materials.html'+location.search));return}if(u.uid!==ADMIN_UID){try{const p=await get(ref(db,'studentProfiles/'+u.uid));if(!p.exists()||!p.val()?.username){location.replace('register.html?next='+encodeURIComponent('materials.html'+location.search));return}}catch(e){location.replace('register.html?next='+encodeURIComponent('materials.html'+location.search));return}}load(u).catch(e=>{$('state').textContent='Could not load materials. Please try again.';console.error(e)})});
</script>
