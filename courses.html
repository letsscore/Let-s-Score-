<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a Course | LET’S SCORE</title><meta name="description" content="Choose a LET’S SCORE course"><style>
:root{color-scheme:dark;--bg:#061326;--panel:#0d203a;--line:#23466b;--text:#f4f8ff;--muted:#bdcfe5;--cyan:#21c8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}.brand{font-weight:900;color:var(--cyan);font-size:22px;text-decoration:none}.top a:not(.brand),a{color:#70dcff}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0}h1{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:0 0 16px}h2{margin-top:0}.muted{color:var(--muted)}label{display:block;margin:14px 0 6px}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #345879;background:#061326;color:#fff;font:inherit}.btn{display:inline-block;padding:12px 17px;background:linear-gradient(120deg,#04b8f5,#4c55ff);color:#fff!important;border:0;border-radius:10px;font-weight:700;text-decoration:none;cursor:pointer;margin:10px 8px 0 0}.btn.alt{background:#183b59}.btn:disabled{opacity:.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.tile{padding:18px;border:1px solid var(--line);border-radius:14px;background:#0a1a30}.msg{padding-top:12px;color:#9ce9ff;overflow-wrap:anywhere}.hidden{display:none!important}.resource{padding:16px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.resource a{display:inline-block;margin:5px 0}footer{color:var(--muted);text-align:center;padding:28px 10px}@media(max-width:600px){.wrap{padding:15px}.panel{padding:18px}}
</style></head><body><div class="wrap"><nav class="top"><a class="brand" href="index.html">🎓 LET’S SCORE</a><div><a href="index.html">Home</a>　<a href="courses.html">Courses</a>　<a href="register.html">Account</a></div></nav><section class="panel"><h1>Choose a course</h1><p class="muted">Select the course you want to study.</p><div id="grid" class="grid"></div><button id="logout" class="btn alt hidden">Log out</button></section></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import {getDatabase,ref,get} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js';
const firebaseConfig={apiKey:"AIzaSyBdsypDM6A2Q1LO3GTueeg8RfTirXGZIP8",authDomain:"lets-score-revisionary-test.firebaseapp.com",databaseURL:"https://lets-score-revisionary-test-default-rtdb.firebaseio.com",projectId:"lets-score-revisionary-test",storageBucket:"lets-score-revisionary-test.firebasestorage.app",messagingSenderId:"629595293837",appId:"1:629595293837:web:b0fd9e83f22651cd577ac4"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const ADMIN_UID='q8Ybthhc3jQEhQf4e5EAFpYIaDv1';
const courses=[['class10-assamese-free','Class X Science — Assamese Medium','Free notes only','FREE'],['class10-assamese-paid','Class X Science — Assamese Medium','Materials or materials + videos','₹299 / ₹999'],['class10-english','Class X Science — English Medium','Materials or materials + videos','₹299 / ₹999'],['class11-physics','Class XI Physics — English Medium','Materials or materials + videos','₹299 / ₹999'],['class12-physics','Class XII Physics — English Medium','Materials or materials + videos','₹299 / ₹999']];
document.getElementById('grid').innerHTML=courses.map(c=>`<article class="tile"><h2>${c[1]}</h2><p class="muted">${c[2]}</p><strong>${c[3]}</strong><br><a class="btn" href="enrolment.html?course=${c[0]}">Choose course</a></article>`).join('');
onAuthStateChanged(auth,async u=>{if(!u){location.replace('register.html');return}if(u.uid!==ADMIN_UID){try{const p=await get(ref(db,'studentProfiles/'+u.uid));if(!p.exists()||!p.val()?.username){location.replace('register.html');return}const accessible=[];for(const c of courses){if(c[0]==='class10-assamese-free'){const s=await get(ref(db,`studentSelections/${u.uid}/${c[0]}`));if(s.exists())accessible.push(c[0]);continue}const a=await get(ref(db,`courseAccess/${c[0]}/${u.uid}`));if(a.val()?.active===true)accessible.push(c[0])}if(accessible.length===1){location.replace('learn.html?course='+encodeURIComponent(accessible[0]));return}if(accessible.length>1){document.getElementById('grid').innerHTML=courses.filter(c=>accessible.includes(c[0])).map(c=>`<article class="tile"><h2>${c[1]}</h2><p class="muted">Approved course</p><a class="btn" href="learn.html?course=${c[0]}">Continue learning</a></article>`).join('');const h=document.querySelector('h1');if(h)h.textContent='Your approved courses';const desc=document.querySelector('.panel>p');if(desc)desc.textContent='Only courses approved for your account are shown.';document.querySelector('a[href="courses.html"]')?.remove();document.getElementById('logout').classList.remove('hidden');return}}catch(e){console.error('Could not verify course access',e)}}document.getElementById('logout').classList.remove('hidden')});
document.getElementById('logout').onclick=async()=>{await signOut(auth);location.href='register.html'};
</script>
<!-- Shared navigation controls: available on every student and admin page -->
<style id="site-home-back-style">.site-home-back{position:fixed;left:12px;bottom:12px;z-index:99999;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:calc(100vw - 24px);height:auto;min-height:0;padding:7px;writing-mode:horizontal-tb;transform:none;white-space:nowrap;background:rgba(4,17,34,.94);border:1px solid #315777;border-radius:14px;box-shadow:0 5px 22px #0006;backdrop-filter:blur(8px)}.site-home-back a,.site-home-back button{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:auto;height:auto;min-height:36px;writing-mode:horizontal-tb;transform:none;white-space:nowrap;font:600 14px/1.2 Arial,sans-serif;color:#f4f8ff;background:#153452;border:1px solid #3a6385;border-radius:9px;padding:10px 13px;text-decoration:none;cursor:pointer}.site-home-back a:hover,.site-home-back button:hover{background:#12627a}@media(max-width:520px){.site-home-back{left:8px;bottom:8px;max-width:calc(100vw - 16px);gap:6px;padding:6px}.site-home-back a,.site-home-back button{padding:9px 10px;font-size:13px;min-height:34px}}</style>
<nav class="site-home-back" aria-label="Page navigation"><button type="button" id="siteBackButton" aria-label="Go back">← Back</button></nav>
<script id="site-home-back-script">document.getElementById('siteBackButton')?.addEventListener('click',function(){if(window.history.length>1){window.history.back()}else{window.location.href='index.html'}});</script>

</body></html>
