<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Teacher Control | Let's Score</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#071426;
    color:#f5f7fb;
    font-family:Arial,sans-serif;
}

.container{
    max-width:850px;
    margin:auto;
    padding:25px 16px 50px;
}

header{
    text-align:center;
    padding:35px 10px;
}

.label{
    color:#20bdf3;
    font-size:14px;
    letter-spacing:2px;
    font-weight:bold;
}

h1{
    font-size:42px;
    margin:10px 0;
}

.subtitle{
    color:#b9c7da;
    font-size:18px;
}

.card{
    background:#132541;
    border:1px solid #29405f;
    border-radius:22px;
    padding:25px;
    margin:20px 0;
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    color:#dbe7f5;
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #415879;
    background:#09172a;
    color:white;
    font-size:16px;
}

textarea{
    min-height:100px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 20px;
    margin:10px 6px 0 0;
    color:white;
    background:linear-gradient(135deg,#0ea5e9,#6366f1);
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.stop{
    background:#b91c1c;
}

.secondary{
    background:#334155;
}

.status{
    margin-top:18px;
    padding:14px;
    border-radius:10px;
    background:#0a182b;
    color:#b9c7da;
}

.success{
    color:#86efac;
}

.error{
    color:#fca5a5;
}

.question{
    background:#0b1a30;
    border:1px solid #304766;
    padding:18px;
    border-radius:14px;
    margin-top:15px;
}

.hidden{
    display:none;
}

.small{
    color:#9eacc0;
    font-size:13px;
}

footer{
    text-align:center;
    margin-top:40px;
    color:#9eacc0;
}

@media(max-width:600px){
    h1{font-size:34px}
}
</style>
</head>

<body>

<div class="container">

<header>
<div class="label">TEACHER CONTROL</div>
<h1>Revisionary Test Control</h1>
<div class="subtitle">
Class X • Class XI • Class XII
</div>
</header>

<!-- LOGIN -->

<section id="loginBox" class="card">

<h2>🔐 Teacher Login</h2>

<p class="small">
Only the authorised Let's Score teacher account can control tests.
</p>

<label>Email</label>
<input
    id="email"
    type="email"
    placeholder="Teacher email"
>

<label>Password</label>
<input
    id="password"
    type="password"
    placeholder="Password"
>

<button id="loginBtn">
Sign In
</button>

<div id="loginStatus" class="status">
Not signed in.
</div>

</section>


<!-- CONTROL PANEL -->

<section id="controlPanel" class="hidden">

<div class="card">

<h2>🎓 Test Control</h2>

<div id="authStatus" class="status"></div>

<label>Class</label>

<select id="classSelect">

<option value="classX">
Class X
</option>

<option value="classXI">
Class XI
</option>

<option value="classXII">
Class XII
</option>

</select>


<label>Test ID</label>

<input
    id="testId"
    placeholder="weekly-test-01"
>


<label>Test Title</label>

<input
    id="testTitle"
    placeholder="Weekly Revision Test 1"
>


<label>Duration (minutes)</label>

<input
    id="duration"
    type="number"
    value="30"
    min="1"
>


<label>Instructions</label>

<textarea
    id="instructions"
    placeholder="Instructions for students"
></textarea>

</div>


<div class="card">

<h2>📝 Questions</h2>

<div id="questions"></div>

<button onclick="addQuestion()">
+ Add Question
</button>

</div>


<div class="card">

<h2>🚦 Test Status</h2>

<button onclick="saveTest()">
Save Test
</button>

<button onclick="loadTest()" class="secondary">
Load Test
</button>

<br>

<button onclick="makeLive()">
MAKE LIVE
</button>

<button onclick="stopTest()" class="stop">
STOP TEST
</button>

<div id="controlStatus" class="status">
Ready.
</div>

</div>


<div class="card">

<button onclick="logout()" class="secondary">
Sign Out
</button>

</div>

</section>


<footer>
LET'S SCORE<br>
Teacher Control • Revisionary Tests
</footer>

</div>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getDatabase,
ref,
set,
get,
update
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ==============================
   EXISTING LET'S SCORE FIREBASE
   ============================== */

const firebaseConfig = {

apiKey:
"AIzaSyBdsypDM6A2Q1LO3GTueeg8RfTirXGZIP8",

authDomain:
"lets-score-revisionary-test.firebaseapp.com",

databaseURL:
"https://lets-score-revisionary-test-default-rtdb.firebaseio.com",

projectId:
"lets-score-revisionary-test",

storageBucket:
"lets-score-revisionary-test.firebasestorage.app"

};


/* ==============================
   TEACHER UID
   ============================== */

const TEACHER_UID =
"LfkeX239CtakaSIBAV8oBCiG2pR2";


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);


/* ==============================
   LOGIN
   ============================== */

document
.getElementById("loginBtn")
.onclick = async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const status =
document.getElementById("loginStatus");

if(!email || !password){

status.innerHTML =
'<span class="error">Enter email and password.</span>';

return;
}

try{

const credential =
await signInWithEmailAndPassword(
auth,
email,
password
);

if(
credential.user.uid !== TEACHER_UID
){

await signOut(auth);

status.innerHTML =
'<span class="error">This account is not authorised as teacher.</span>';

return;
}

status.innerHTML =
'<span class="success">Teacher authenticated successfully.</span>';

}

catch(error){

console.error(error);

status.innerHTML =
'<span class="error">Login failed: ' +
escapeHTML(error.message) +
'</span>';

}

};


/* ==============================
   AUTH STATE
   ============================== */

onAuthStateChanged(
auth,
function(user){

const loginBox =
document.getElementById("loginBox");

const controlPanel =
document.getElementById("controlPanel");

if(
user &&
user.uid === TEACHER_UID
){

loginBox.classList.add("hidden");

controlPanel.classList.remove("hidden");

document
.getElementById("authStatus")
.innerHTML =
'<span class="success">✓ Teacher authenticated</span>';

}
else{

loginBox.classList.remove("hidden");

controlPanel.classList.add("hidden");

}

});


/* ==============================
   QUESTIONS
   ============================== */

window.addQuestion =
function(data = {}){

const box =
document.createElement("div");

box.className =
"question";

box.innerHTML = `

<label>Question</label>

<textarea class="q"
placeholder="Enter question">${escapeHTML(
data.question || ""
)}</textarea>

<label>Option A</label>

<input class="a"
value="${escapeAttr(
data.options?.A || ""
)}">

<label>Option B</label>

<input class="b"
value="${escapeAttr(
data.options?.B || ""
)}">

<label>Option C</label>

<input class="c"
value="${escapeAttr(
data.options?.C || ""
)}">

<label>Option D</label>

<input class="d"
value="${escapeAttr(
data.options?.D || ""
)}">

<label>Correct Option</label>

<select class="correct">

<option ${
data.correct === "A"
? "selected"
: ""
}>A</option>

<option ${
data.correct === "B"
? "selected"
: ""
}>B</option>

<option ${
data.correct === "C"
? "selected"
: ""
}>C</option>

<option ${
data.correct === "D"
? "selected"
: ""
}>D</option>

</select>

<br>

<button
class="stop"
onclick="this.parentElement.remove()">
Remove Question
</button>

`;

document
.getElementById("questions")
.appendChild(box);

};


/* ==============================
   COLLECT QUESTIONS
   ============================== */

function collectQuestions(){

return [

...document
.querySelectorAll(".question")

].map(

(box,index)=>({

number:index+1,

question:
box.querySelector(".q").value.trim(),

options:{

A:
box.querySelector(".a").value.trim(),

B:
box.querySelector(".b").value.trim(),

C:
box.querySelector(".c").value.trim(),

D:
box.querySelector(".d").value.trim()

},

correct:
box.querySelector(".correct").value

})

);

}


/* ==============================
   DATABASE PATH
   ============================== */

function testPath(){

const cls =
document.getElementById("classSelect").value;

const id =
document.getElementById("testId").value.trim();

if(!id){

throw new Error(
"Please enter Test ID."
);

}

return
`revisionaryTests/${cls}/${id}`;

}


/* ==============================
   SAVE TEST
   ============================== */

window.saveTest =
async function(){

try{

if(!auth.currentUser ||
auth.currentUser.uid !== TEACHER_UID){

throw new Error(
"Teacher authentication required."
);

}

await set(

ref(db,testPath()),

{

class:
document.getElementById("classSelect").value,

title:
document.getElementById("testTitle").value.trim(),

duration:
Number(
document.getElementById("duration").value
) || 30,

instructions:
document.getElementById("instructions").value.trim(),

questions:
collectQuestions(),

live:false,

updatedAt:
Date.now()

}

);

showStatus(
"Test saved successfully. It is NOT LIVE.",
"success"
);

}

catch(error){

console.error(error);

showStatus(
error.message,
"error"
);

}

};


/* ==============================
   LOAD TEST
   ============================== */

window.loadTest =
async function(){

try{

const snapshot =
await get(
ref(db,testPath())
);

if(!snapshot.exists()){

showStatus(
"Test not found.",
"error"
);

return;

}

const data =
snapshot.val();

document
.getElementById("testTitle")
.value =
data.title || "";

document
.getElementById("duration")
.value =
data.duration || 30;

document
.getElementById("instructions")
.value =
data.instructions || "";

document
.getElementById("questions")
.innerHTML = "";

if(data.questions){

Object
.values(data.questions)
.forEach(addQuestion);

}

showStatus(

data.live
? "Test loaded — currently LIVE."
: "Test loaded — currently NOT LIVE.",

data.live
? "success"
: ""

);

}

catch(error){

console.error(error);

showStatus(
error.message,
"error"
);

}

};


/* ==============================
   MAKE LIVE
   ============================== */

window.makeLive =
async function(){

try{

if(!auth.currentUser ||
auth.currentUser.uid !== TEACHER_UID){

throw new Error(
"Teacher authentication required."
);

}

await update(

ref(db,testPath()),

{

live:true,

updatedAt:
Date.now()

}

);

showStatus(
"✓ TEST IS NOW LIVE.",
"success"
);

}

catch(error){

showStatus(
error.message,
"error"
);

}

};


/* ==============================
   STOP TEST
   ============================== */

window.stopTest =
async function(){

try{

if(!auth.currentUser ||
auth.currentUser.uid !== TEACHER_UID){

throw new Error(
"Teacher authentication required."
);

}

await update(

ref(db,testPath()),

{

live:false,

updatedAt:
Date.now()

}

);

showStatus(
"TEST STOPPED.",
"error"
);

}

catch(error){

showStatus(
error.message,
"error"
);

}

};


/* ==============================
   LOGOUT
   ============================== */

window.logout =
function(){

signOut(auth);

};


/* ==============================
   STATUS
   ============================== */

function showStatus(message,type){

document
.getElementById("controlStatus")
.innerHTML =
`<span class="${type}">
${escapeHTML(message)}
</span>`;

}


/* ==============================
   SECURITY HELPERS
   ============================== */

function escapeHTML(value){

return String(value ?? "")
.replace(
/[&<>"']/g,

function(char){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[char];

});

}


function escapeAttr(value){

return escapeHTML(value);

}


/* Start with one question */

addQuestion();

</script>

</body>
</html>
