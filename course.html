<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Enrolment | LET’S SCORE</title><meta name="description" content="Course payment and access approval"><style>
:root{color-scheme:dark;--bg:#061326;--panel:#0d203a;--line:#23466b;--text:#f4f8ff;--muted:#bdcfe5;--cyan:#21c8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}.brand{font-weight:900;color:var(--cyan);font-size:22px;text-decoration:none}.top a:not(.brand),a{color:#70dcff}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0}h1{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:0 0 16px}h2{margin-top:0}.muted{color:var(--muted)}label{display:block;margin:14px 0 6px}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #345879;background:#061326;color:#fff;font:inherit}.btn{display:inline-block;padding:12px 17px;background:linear-gradient(120deg,#04b8f5,#4c55ff);color:#fff!important;border:0;border-radius:10px;font-weight:700;text-decoration:none;cursor:pointer;margin:10px 8px 0 0}.btn.alt{background:#183b59}.btn:disabled{opacity:.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.tile{padding:18px;border:1px solid var(--line);border-radius:14px;background:#0a1a30}.msg{padding-top:12px;color:#9ce9ff;overflow-wrap:anywhere}.hidden{display:none!important}.resource{padding:16px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.resource a{display:inline-block;margin:5px 0}footer{color:var(--muted);text-align:center;padding:28px 10px}@media(max-width:600px){.wrap{padding:15px}.panel{padding:18px}}
</style></head><body><div class="wrap"><nav class="top"><a class="brand" href="index.html">🎓 LET’S SCORE</a><div><a href="index.html">Home</a>　<a href="courses.html">Courses</a></div></nav><section class="panel"><a href="courses.html">← Courses</a><h1 id="title">Course</h1><p id="desc" class="muted"></p><div id="freeBox" class="hidden"><p>This course is free.</p><a id="freeLink" class="btn" href="#">Open course materials</a></div><div id="paidBox" class="hidden"><label for="pkg">Package</label><select id="pkg"><option value="notes">₹299 — Study materials</option><option value="videos">₹999 — Materials + recorded video lectures</option></select><p id="fee"></p><a id="pay" class="btn" href="#">Pay with UPI</a><a id="wa" class="btn alt" href="#" target="_blank" rel="noopener">Send receipt on WhatsApp</a><label for="utr">UPI transaction reference (UTR)</label><input id="utr" placeholder="Enter UTR after payment"><button class="btn" id="submit">Submit payment for approval</button><p id="status" class="msg"></p></div></section></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import {getDatabase,ref,get,set} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js';
const firebaseConfig={apiKey:"AIzaSyBdsypDM6A2Q1LO3GTueeg8RfTirXGZIP8",authDomain:"lets-score-revisionary-test.firebaseapp.com",databaseURL:"https://lets-score-revisionary-test-default-rtdb.firebaseio.com",projectId:"lets-score-revisionary-test",messagingSenderId:"629595293837",appId:"1:629595293837:web:b0fd9e83f22651cd577ac4"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=x=>document.getElementById(x);
const id=new URLSearchParams(location.search).get('id');
const courses={
'class10-assamese-free':{name:'Class X Science — Assamese Medium (Free)',desc:'Free chapter-wise notes.',free:true},
'class10-assamese-paid':{name:'Class X Science — Assamese Medium',desc:'Chapter-wise notes, NCERT solutions and question bank.'},
'class10-english':{name:'Class X Science — English Medium',desc:'Chapter-wise notes, NCERT solutions and question bank.'},
'class11-physics':{name:'Class XI Physics — English Medium',desc:'Chapter-wise notes, NCERT solutions and question bank.'},
'class12-physics':{name:'Class XII Physics — English Medium',desc:'Chapter-wise notes, NCERT solutions and question bank.'}};
const c=courses[id];if(!c){location.href='courses.html'}else{$('title').textContent=c.name;$('desc').textContent=c.desc}
let user=null,watch=null;
function setPaymentLinks(){const pkg=$('pkg').value,fee=pkg==='videos'?999:299;$('fee').textContent=`Selected package: ${pkg==='videos'?'Materials + recorded video lectures':'Study materials only'} · ₹${fee}`;$('pay').href='upi://pay?'+new URLSearchParams({pa:'9678945621@upi',pn:'LETS SCORE',am:fee+'.00',cu:'INR',tn:c.name});$('wa').href='https://wa.me/917002137940?text='+encodeURIComponent(`Hello LET'S SCORE, payment receipt for ${c.name}. Email: ${user?.email||''}. Package: ₹${fee}. UTR: ${$('utr').value}`)}
$('pkg').onchange=setPaymentLinks;
async function checkAccess(){if(!user||!c)return;try{if(c.free){location.href='materials.html?id='+id;return}const s=await get(ref(db,`courseAccess/${id}/${user.uid}`)),a=s.val();if(a?.active===true){clearInterval(watch);location.href='materials.html?id='+id;return}const req=(await get(ref(db,`accessRequests/${id}/${user.uid}`))).val();$('status').textContent=req?.status==='pending'?'Payment request submitted. Waiting for approval.':'After paying, submit your UTR and wait for approval.'}catch(e){$('status').textContent='Could not check status. Please try again.'}}
$('submit').onclick=async()=>{if(!user){location.href='student.html';return}const utr=$('utr').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(utr.length<6){$('status').textContent='Enter a valid UTR and send your receipt on WhatsApp.';return}const pkg=$('pkg').value,fee=pkg==='videos'?999:299;try{await set(ref(db,`accessRequests/${id}/${user.uid}`),{utr,courseId:id,package:pkg,fee,includesRecordedVideos:pkg==='videos',status:'pending',studentUid:user.uid,studentEmail:user.email||'',requestedAt:Date.now()});$('status').textContent='Request submitted. This page will open your materials automatically after approval.';setPaymentLinks();checkAccess()}catch(e){$('status').textContent='Request failed: '+e.message}};
onAuthStateChanged(auth,async u=>{user=u;if(!u){location.href='student.html?next='+encodeURIComponent('course.html?id='+id);return}if(c?.free){$('freeBox').classList.remove('hidden');$('freeLink').href='materials.html?id='+id;checkAccess()}else{$('paidBox').classList.remove('hidden');setPaymentLinks();await checkAccess();watch=setInterval(checkAccess,10000)}});
</script></body></html>
