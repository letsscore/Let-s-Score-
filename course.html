<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Course | Let's Score</title>
<style>
:root{--bg:#07111f;--bg2:#0d1930;--card:#12213a;--line:#263756;--text:#f8fafc;--muted:#b9c5d8;--blue:#38bdf8;--gold:#fbbf24;--green:#4ade80;--red:#f87171}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,var(--bg),var(--bg2));color:var(--text);font-family:Arial,sans-serif;line-height:1.65}.wrap{max-width:1000px;margin:auto;padding:0 16px 50px}nav{border-bottom:1px solid #ffffff14;background:#07111fee;padding:14px 0}.navin{max-width:1000px;margin:auto;padding:0 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{color:var(--blue);font-size:23px;font-weight:900;text-decoration:none}nav a{color:#e2e8f0;text-decoration:none;margin-left:14px;font-weight:700;font-size:13px}.hero{text-align:center;padding:48px 0 28px}.kicker{color:var(--blue);font-weight:900;letter-spacing:1.5px;font-size:13px}h1{font-size:clamp(32px,7vw,56px);margin:8px 0}.muted{color:var(--muted)}.badge{display:inline-block;padding:5px 11px;border-radius:20px;background:#ffffff0d;color:#bae6fd;font-size:12px;font-weight:900}.card{background:rgba(18,33,58,.97);border:1px solid var(--line);border-radius:20px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.item{background:#ffffff06;border:1px solid #ffffff12;border-radius:15px;padding:18px}.item a{color:var(--blue);font-weight:800;text-decoration:none}.pay{border-left:4px solid var(--gold)}.free{border-left:4px solid var(--green)}input{width:100%;padding:12px;border-radius:10px;background:#0d1930;border:1px solid var(--line);color:#fff;font-size:15px}.btn{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:10px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#0ea5e9,#6366f1);font-weight:900;border:0;cursor:pointer;font-size:15px}.msg{margin-top:12px;font-weight:800}.ok{color:var(--green)}.bad{color:var(--red)}.lock{border:1px dashed #465985;border-radius:15px;padding:22px;text-align:center;color:var(--muted)}footer{border-top:1px solid #ffffff14;padding:25px 0;text-align:center;color:var(--muted)}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:10px}
</style></head>
<body><nav><div class="navin"><a class="logo" href="index.html">🎓 LET'S SCORE</a><div><a href="index.html">Home</a><a href="courses.html">Courses</a></div></div></nav>
<main class="wrap"><section class="hero"><div class="kicker">LET'S SCORE COURSE</div><h1 id="courseName">Loading...</h1><p id="courseInfo" class="muted"></p><span id="courseBadge" class="badge"></span></section>
<section id="payCard" class="card pay" style="display:none"><h2>🔓 Paid Course Access</h2><p class="muted" id="feeText"></p><p class="muted">Enter the UTR / Transaction Reference Number that your teacher approved for this course.</p><input id="utr" placeholder="UTR / Transaction Reference Number"><button class="btn" id="checkBtn">Check My Access</button><div id="msg" class="msg"></div></section>
<section id="resourceCard" class="card"><h2>📚 Course Resources</h2><div id="locked" class="lock">Loading course access...</div><div id="resources" style="display:none"></div></section>
</main><footer>LET'S SCORE<br>Learn • Revise • Practise • Score</footer>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getDatabase,ref,get,onValue}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyBdsypDM6A2Q1LO3GTueeg8RfTirXGZIP8",authDomain:"lets-score-revisionary-test.firebaseapp.com",databaseURL:"https://lets-score-revisionary-test-default-rtdb.firebaseio.com",projectId:"lets-score-revisionary-test",storageBucket:"lets-score-revisionary-test.firebasestorage.app",messagingSenderId:"629595293837",appId:"1:629595293837:web:b0fd9e83f22651cd577ac4"};
const db=getDatabase(initializeApp(firebaseConfig));const id=new URLSearchParams(location.search).get('id');let course=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function normalize(v){return String(v||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'')}
function video(url){const y=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{6,})/);if(y)return `<iframe src="https://www.youtube.com/embed/${y[1]}" allowfullscreen></iframe>`;const d=url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);if(d)return `<iframe src="https://drive.google.com/file/d/${d[1]}/preview" allowfullscreen></iframe>`;return `<video controls style="width:100%;margin-top:10px" src="${esc(url)}"></video>`}
async function load(){if(!id){document.getElementById('courseName').textContent='Course not specified';return}const cs=await get(ref(db,'courses/'+id));if(!cs.exists()){document.getElementById('courseName').textContent='Course not found';return}course=cs.val();document.getElementById('courseName').textContent=course.name||'Course';document.getElementById('courseBadge').textContent=course.type==='paid'?'💳 PAID COURSE':'🟢 FREE COURSE';document.getElementById('courseInfo').textContent=[course.className,course.subject,course.language].filter(Boolean).join(' • ');if(course.type==='paid'){document.getElementById('payCard').style.display='block';document.getElementById('feeText').textContent='Course Fee: ₹'+(course.fee||0);document.getElementById('locked').textContent='🔒 Enter your approved UTR above to unlock resources.'}else unlock();}
function unlock(){document.getElementById('locked').style.display='none';document.getElementById('resources').style.display='block';const cats={notes:'📖 Notes',solutions:'📘 NCERT Solutions',videos:'🎥 Video Lectures',papers:'📄 Model Papers'};let html='';Object.entries(cats).forEach(([cat,label])=>{onValue(ref(db,`courseResources/${id}/${cat}`),snap=>{const box=document.getElementById('resources');let sections={};document.querySelectorAll('[data-cat]').forEach(e=>sections[e.dataset.cat]=e);let el=sections[cat];if(!el){el=document.createElement('section');el.className='card';el.dataset.cat=cat;el.innerHTML='<h2>'+label+'</h2><div class="grid"></div>';box.appendChild(el)}const grid=el.querySelector('.grid');const data=snap.val()||{};const items=Object.values(data).sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));grid.innerHTML=items.length?items.map(x=>`<div class="item"><strong>${esc(x.title||'Resource')}</strong>${cat==='videos'?video(x.url):`<p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Open Resource →</a></p>`}</div>`).join(''):'<p class="muted">Nothing added yet.</p>'})});}
document.getElementById('checkBtn').addEventListener('click',async()=>{const u=normalize(document.getElementById('utr').value),m=document.getElementById('msg');if(!u){m.className='msg bad';m.textContent='Enter your UTR.';return}try{const s=await get(ref(db,`enrollments/${id}/${u}`));if(s.exists()&&s.val().paid===true){localStorage.setItem('ls_'+id,u);m.className='msg ok';m.textContent='✓ Access granted.';unlock()}else{m.className='msg bad';m.textContent='This UTR has not been approved for this course.'}}catch(e){m.className='msg bad';m.textContent='Could not check access right now.'}});
load().then(()=>{if(course?.type==='paid'){const u=localStorage.getItem('ls_'+id);if(u){document.getElementById('utr').value=u;document.getElementById('checkBtn').click()}}});
</script></body></html>
