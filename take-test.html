<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LET'S SCORE | Revisionary Test</title><link rel="stylesheet" href="revisionary-test.css"></head>
<body><header class="rt-header"><a class="rt-brand" href="revisionary-test.html">🎓 LET'S SCORE</a><a href="revisionary-test.html">← Classes</a></header>
<main class="rt-page">
<section id="loading" class="rt-panel rt-center"><div class="rt-loader"></div><p>Connecting to test server…</p></section>
<section id="locked" class="rt-panel rt-center rt-hidden"><div class="rt-big-icon">🔒</div><h1 id="lockTitle">Test Not Started</h1><p id="lockText">Your teacher has not started this test yet.</p><a class="rt-btn" href="revisionary-test.html">Back to Classes</a></section>
<section id="identity" class="rt-panel rt-auth rt-hidden"><div class="rt-big-icon">🎓</div><h1>Enter Test</h1><p id="identityMeta"></p><input id="studentName" placeholder="Student name"><input id="studentRoll" placeholder="Roll / ID (optional)"><button class="rt-btn" onclick="beginExam()">Start Test</button><small id="identityError"></small></section>
<section id="exam" class="rt-hidden"><div class="rt-panel rt-exam-head"><div><span id="examClass" class="rt-eyebrow"></span><h1 id="testTitle"></h1><p id="meta"></p></div><div class="rt-timer"><small>TIME LEFT</small><strong id="timer">00:00</strong></div></div>
<div class="rt-exam-layout"><section class="rt-panel"><div class="rt-qtop"><span id="count"></span><span id="percent"></span></div><div class="rt-bar"><i id="bar"></i></div><h2 id="question"></h2><div id="options" class="rt-options"></div><div class="rt-actions"><button class="rt-btn secondary" onclick="prevQ()">← Previous</button><button id="next" class="rt-btn" onclick="nextQ()">Next →</button></div></section>
<aside class="rt-panel"><h3>Questions</h3><div id="nav" class="rt-navgrid"></div><button class="rt-btn danger full" onclick="submitExam()">Submit Test</button></aside></div></section>
<section id="result" class="rt-panel rt-center rt-hidden"><div class="rt-big-icon">🏆</div><h1>Test Submitted</h1><div id="score" class="rt-score"></div><p id="breakdown"></p><a class="rt-btn" href="revisionary-test.html">Back to Revisionary Test</a></section>
</main><script src="revisionary-test.js"></script><script>document.addEventListener("DOMContentLoaded",startStudentTest);</script></body></html>
