<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login | LET’S SCORE</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="shell nav"><a class="brand" href="index.html">🎓 LET’S <span>SCORE</span></a><nav class="navlinks"><a href="index.html">Home</a><a href="courses.html">Courses</a><a href="dashboard.html">My learning</a></nav></div></header><main class="shell content"><header class="page-head"><div class="eyebrow">Student account</div><h1>Welcome back.</h1><p>Sign in to continue learning, or create an account to enrol in a course.</p></header><section class="panel"><div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="6" placeholder="At least 6 characters" autocomplete="current-password"></div><div class="field" id="nameField"><label for="studentName">Full name (for new accounts)</label><input id="studentName" placeholder="Student full name" autocomplete="name"></div><div class="form-actions"><button class="btn" id="loginBtn">Log in</button><button class="btn btn-light" id="registerBtn">Create account</button></div><div class="msg" id="authMsg" role="status"></div><p class="muted" style="font-size:13px">Your account is used for enrolment requests and course access.</p></section></main><footer class="footer"><div class="shell footer-inner"><span>© LET’S SCORE</span><a href="https://wa.me/917002137940">Need help?</a></div></footer><script type="module" src="common.js"></script></body></html>
