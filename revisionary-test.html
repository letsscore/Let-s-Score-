<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Revisionary Test | Let's Score</title>

<style>
:root{
  --bg:#081426;
  --card:#14213a;
  --card2:#101d33;
  --line:#263756;
  --text:#f8fafc;
  --muted:#b9c5d8;
  --blue:#38bdf8;
  --green:#86efac;
  --red:#fca5a5;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#06101f,#101a35);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:25px 16px 50px;
}

.brand{
  font-size:25px;
  font-weight:800;
  color:var(--blue);
}

.hero{
  text-align:center;
  padding:50px 0 30px;
}

.tag{
  color:var(--blue);
  font-size:13px;
  letter-spacing:1.5px;
  font-weight:700;
}

.hero h1{
  font-size:clamp(38px,8vw,65px);
  margin:10px 0;
}

.muted{
  color:var(--muted);
  line-height:1.6;
}

.card{
  background:rgba(20,33,58,.96);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
}

.test{
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  text-align:center;
}

.test h2{
  margin:0 0 12px;
  font-size:25px;
}

.status{
  font-weight:800;
  color:var(--red);
  margin-bottom:8px;
}

.live{
  color:var(--green);
}

.btn{
  display:inline-block;
  margin-top:16px;
  padding:13px 20px;
  border-radius:12px;
  text-decoration:none;
  color:white;
  background:linear-gradient(135deg,#0ea5e9,#6366f1);
  font-weight:800;
}

.disabled{
  opacity:.45;
  pointer-events:none;
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:30px;
}

.error{
  text-align:center;
  color:#fbbf24;
  padding:20px;
  line-height:1.6;
}
</style>
</head>

<body>

<main class="wrap">

  <div class="brand">🎓 LET'S SCORE</div>

  <section class="hero">
    <div class="tag">TEACHER-CONTROLLED • CLASSES VI–XII</div>

    <h1>Revisionary Test</h1>

    <p class="muted">
      Choose your class. A test becomes accessible only when the teacher starts it.
    </p>
  </section>

  <section class="card">

    <div id="grid" class="grid">
      <div class="loading">
        Checking test status...
      </div>
    </div>

  </section>

</main>


<script type="module">

import { initializeApp }
from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';

import {
  getDatabase,
  ref,
  onValue
}
from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js';

import { firebaseConfig }
from './firebase-config-module.js';


/* INITIALIZE FIREBASE */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* AVAILABLE CLASSES */

const classes = [
  'VI',
  'VII',
  'VIII',
  'IX',
  'X',
  'XI',
  'XII'
];


const grid = document.getElementById('grid');


/* CREATE CLASS CARDS */

function renderTests(data){

  grid.innerHTML = classes.map(className => {

    const testData = data?.[className];

    const live =
      testData &&
      testData.started === true;


    const testFile =
      `test-${className.toLowerCase()}.html`;


    return `

      <article class="test">

        <h2>Class ${className}</h2>

        <div class="status ${live ? 'live' : ''}">
          ${live
            ? '● TEST LIVE'
            : '● TEST NOT STARTED'}
        </div>

        <p class="muted">
          ${live
            ? 'The teacher has opened this test.'
            : 'Waiting for the teacher to start the test.'}
        </p>

        ${
          live

          ?

          `
          <a
            class="btn"
            href="${testFile}">
            Enter Test
          </a>
          `

          :

          `
          <a
            class="btn disabled"
            href="#">
            Test Locked
          </a>
          `
        }

      </article>

    `;

  }).join('');

}


/* FIREBASE LIVE STATUS */

try{

  const testsRef = ref(db,'tests');

  onValue(
    testsRef,

    snapshot => {

      const data =
        snapshot.val() || {};

      renderTests(data);

    },

    error => {

      console.error(error);

      grid.innerHTML = `

        <div class="error">

          Unable to read the test status.

          <br>

          Please check the Firebase Realtime Database rules.

        </div>

      `;

    }
  );

}
catch(error){

  console.error(error);

  grid.innerHTML = `

    <div class="error">

      Firebase could not be initialized.

      <br>

      Please check firebase-config-module.js.

    </div>

  `;

}

</script>

</body>
</html>
