<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Select Resource — Free Demo — Let's Score</title>
<style>
:root{--bg:#07111f;--bg2:#0d1930;--card:#12213a;--line:#263756;--text:#f8fafc;--muted:#b9c5d8;--blue:#38bdf8;--indigo:#6366f1;--gold:#fbbf24}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(145deg,var(--bg),var(--bg2));color:var(--text);font-family:Arial,sans-serif;line-height:1.65}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
nav{position:sticky;top:0;z-index:10;background:#07111fee;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff14}
.navin{max-width:1100px;margin:auto;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:24px;font-weight:900;color:var(--blue);text-decoration:none}
nav a{color:#e2e8f0;text-decoration:none;margin-left:18px;font-weight:700;font-size:14px}
.hero{text-align:center;padding:55px 0 20px}.kicker{color:var(--gold);font-weight:900;letter-spacing:2px;font-size:13px}
.hero h1{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:12px 0}.hero h1 span{color:var(--blue)}
.hero p{max-width:700px;margin:0 auto;color:var(--muted);font-size:16px}
.section{padding:20px 0 55px}
.steps{display:flex;justify-content:center;gap:10px;margin:0 0 28px;flex-wrap:wrap}
.step{padding:8px 16px;border-radius:999px;border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--muted)}
.step.active{background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;border-color:transparent}
.step.done{background:#1c2c4a;color:#93c5fd;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:rgba(18,33,58,.96);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:center;cursor:pointer;text-decoration:none;color:var(--text);display:block;transition:transform .15s, border-color .15s}
.card:hover{transform:translateY(-4px);border-color:var(--blue)}
.card h3{font-size:19px;margin:0 0 8px}.card p{color:var(--muted);margin:0;font-size:14px}
.backlink{display:inline-block;margin-bottom:18px;color:var(--blue);text-decoration:none;font-weight:700;font-size:14px}
footer{border-top:1px solid #ffffff14;padding:28px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<nav><div class="navin">
<a class="logo" href="index.html">🎓 LET'S SCORE</a>
<div class="navlinks">
<a href="index.html">Home</a><a href="courses.html">Courses</a>
<a href="revisionary-test.html">Revisionary Test</a><a href="contact.html">Contact</a>
</div></div></nav>

<main class="wrap">
<section class="hero">
<div class="kicker">FREE DEMO</div>
<h1>Selected: <span id="className">—</span></h1>
<p>Now choose the resource you'd like to preview for free.</p>
</section>

<section class="section">
<a class="backlink" href="demo.html">← Change Class</a>
<div class="steps">
<div class="step done">1. Select Class ✓</div>
<div class="step active">2. Select Resource</div>
<div class="step">3. Watch / View Demo</div>
</div>

<div class="grid" id="resourceGrid"></div>
</section>
</main>

<footer><div class="wrap"><strong>LET'S SCORE</strong><br>Learn • Revise • Practise • Score</div></footer>

<script>
const classNames={
"x-science-as":"Class X — Science (Assamese Medium)",
"x-science-en":"Class X — Science (English Medium)",
"xi-physics-en":"Class XI — Physics (English Medium)",
"xii-physics-en":"Class XII — Physics (English Medium)"
};
const params=new URLSearchParams(window.location.search);
const cls=params.get("class")||"";
document.getElementById("className").textContent=classNames[cls]||"Please select a class";

const resources=[
{key:"notes",title:"📚 Notes",desc:"Concept notes and summaries."},
{key:"solutions",title:"📖 Text Book Solutions",desc:"Step-by-step solved exercises."},
{key:"video",title:"🎥 Video Lecture",desc:"Watch a free sample lecture."},
{key:"model-paper",title:"📝 Model Paper",desc:"Practice with a sample model paper."}
];
const grid=document.getElementById("resourceGrid");
resources.forEach(r=>{
const a=document.createElement("a");
a.className="card";
a.href="demo-view.html?class="+encodeURIComponent(cls)+"&resource="+encodeURIComponent(r.key);
a.innerHTML="<h3>"+r.title+"</h3><p>"+r.desc+"</p>";
grid.appendChild(a);
});
</script>
</body>
</html>
